<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Energy Project: wind power generation forecasting in Brazil with SARIMA</title>
  <rect width="1200" height="700" fill="#F7F8FA"/>
  <g stroke="#E3E6EA" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200"/>
    <path d="M100 0V700M200 0V700M300 0V700M400 0V700M500 0V700M600 0V700M700 0V700M800 0V700M900 0V700M1000 0V700M1100 0V700"/>
  </g>

  <text x="90" y="110" font-size="40" font-weight="800" fill="#111827">Energy Project</text>
  <text x="90" y="150" font-size="24" fill="#6B7280">Wind power generation forecasting in Brazil</text>

  <!-- Wind turbines -->
  <g stroke="#1F2937" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(190 390)">
      <path d="M-10 0 -18 242H18L10 0Z" fill="#FFFFFF" stroke-width="6"/>
      <g fill="#FFFFFF" stroke-width="6">
        <path d="M0 0 -14 -150Q0 -165 14 -150Z"/>
        <path d="M0 0 -14 -150Q0 -165 14 -150Z" transform="rotate(120)"/>
        <path d="M0 0 -14 -150Q0 -165 14 -150Z" transform="rotate(240)"/>
      </g>
      <circle r="16" fill="#0288D1" stroke-width="6"/>
    </g>
    <g transform="translate(470 470) scale(.6)">
      <path d="M-10 0 -18 270H18L10 0Z" fill="#FFFFFF" stroke-width="8"/>
      <g fill="#FFFFFF" stroke-width="8">
        <path d="M0 0 -14 -150Q0 -165 14 -150Z" transform="rotate(40)"/>
        <path d="M0 0 -14 -150Q0 -165 14 -150Z" transform="rotate(160)"/>
        <path d="M0 0 -14 -150Q0 -165 14 -150Z" transform="rotate(280)"/>
      </g>
      <circle r="16" fill="#0288D1" stroke-width="8"/>
    </g>
  </g>
  <path d="M90 632H520" stroke="#1F2937" stroke-width="6" stroke-linecap="round"/>

  <!-- Time series chart -->
  <g transform="translate(600 200)">
    <rect width="520" height="400" rx="24" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
    <path d="M50 340H480M50 340V50" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
    <!-- forecast confidence band -->
    <path d="M330 150 370 120 410 160 450 110 470 130V230L450 215 410 255 370 220 330 245Z" fill="#B3E5FC" opacity=".8"/>
    <!-- history -->
    <polyline points="60,280 90,250 120,270 150,220 180,240 210,190 240,215 270,170 300,195 330,198"
      fill="none" stroke="#0288D1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- forecast -->
    <polyline points="330,198 370,170 410,205 450,160 470,180"
      fill="none" stroke="#F57C00" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M330 60V340" stroke="#C9CED6" stroke-width="3" stroke-dasharray="8 8"/>
    <rect x="70" y="40" width="150" height="48" rx="24" fill="#E1F5FE" stroke="#0288D1" stroke-width="3"/>
    <text x="145" y="72" text-anchor="middle" font-size="24" font-weight="800" fill="#01579B">SARIMA</text>
    <text x="365" y="380" font-size="20" font-weight="700" fill="#F57C00">forecast</text>
    <text x="150" y="380" font-size="20" font-weight="700" fill="#0288D1">history (MWmed)</text>
  </g>
</svg>
