<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Marketplace EaseDoc: marketplace app, MongoDB, 14 reads and 7 writes, YCSB benchmark</title>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2E7D32"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#E65100"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#F7F8FA"/>
  <g stroke="#E3E6EA" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200"/>
    <path d="M100 0V700M200 0V700M300 0V700M400 0V700M500 0V700M600 0V700M700 0V700M800 0V700M900 0V700M1000 0V700M1100 0V700"/>
  </g>

  <!-- Marketplace storefront -->
  <g transform="translate(90 190)">
    <rect width="260" height="320" rx="28" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
    <path d="M40 120 60 60H200L220 120Z" fill="#1F2937"/>
    <path d="M40 120h180v14a30 30 0 0 1-60 0 30 30 0 0 1-60 0 30 30 0 0 1-60 0z" fill="#47A248"/>
    <rect x="58" y="160" width="144" height="100" rx="10" fill="none" stroke="#1F2937" stroke-width="6"/>
    <rect x="110" y="200" width="40" height="60" rx="4" fill="#1F2937"/>
    <text x="130" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2937">Marketplace</text>
  </g>

  <!-- Reads: database -> app -->
  <path d="M760 300H372" stroke="#2E7D32" stroke-width="10" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="470" y="232" width="190" height="52" rx="26" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
  <text x="565" y="267" text-anchor="middle" font-size="28" font-weight="700" fill="#1B5E20">14 reads</text>

  <!-- Writes: app -> database -->
  <path d="M372 400H760" stroke="#E65100" stroke-width="10" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="470" y="418" width="190" height="52" rx="26" fill="#FFF3E0" stroke="#E65100" stroke-width="3"/>
  <text x="565" y="453" text-anchor="middle" font-size="28" font-weight="700" fill="#BF360C">7 writes</text>

  <!-- MongoDB cylinder -->
  <g transform="translate(790 200)">
    <path d="M0 40v220c0 22 70 40 150 40s150-18 150-40V40" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
    <ellipse cx="150" cy="40" rx="150" ry="40" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
    <path d="M0 113c0 22 70 40 150 40s150-18 150-40M0 186c0 22 70 40 150 40s150-18 150-40" fill="none" stroke="#C9CED6" stroke-width="5"/>
    <!-- leaf -->
    <path d="M150 74c-30 30-34 74-4 116l4 26 4-26c30-42 26-86-4-116z" fill="#47A248"/>
    <path d="M150 92v120" stroke="#2E7D32" stroke-width="4"/>
    <text x="150" y="350" text-anchor="middle" font-size="30" font-weight="700" fill="#1F2937">MongoDB</text>
  </g>

  <!-- YCSB latency bars -->
  <g transform="translate(860 590)">
    <text x="-14" y="38" text-anchor="end" font-size="24" font-weight="700" fill="#4B5563">YCSB</text>
    <rect x="0" y="10" width="34" height="40" rx="5" fill="#47A248"/>
    <rect x="44" y="-6" width="34" height="56" rx="5" fill="#47A248" opacity=".8"/>
    <rect x="88" y="20" width="34" height="30" rx="5" fill="#47A248" opacity=".6"/>
    <rect x="132" y="-20" width="34" height="70" rx="5" fill="#47A248" opacity=".45"/>
  </g>

  <text x="90" y="110" font-size="40" font-weight="800" fill="#111827">Marketplace EaseDoc</text>
  <text x="90" y="150" font-size="24" fill="#6B7280">Case study for NoSQL schema selection</text>
</svg>
